<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 56" width="460" height="56" role="img" aria-label="CONTAGION-STOP">
  <!-- Varian A — Raised plaque: wordmark navy di atas plakat silver
       dengan bevel Win98 tebal (putih kiri/atas, hitam kanan/bawah).
       Palet: #c0c0c0 / #dfdfdf / #fff / #808080 / #0a0a0a / #000080. -->
  <rect x="2" y="5" width="456" height="46" fill="#c0c0c0"/>
  <!-- bevel: highlight atas+kiri -->
  <rect x="2" y="5" width="456" height="2" fill="#ffffff"/>
  <rect x="2" y="5" width="2" height="46" fill="#ffffff"/>
  <rect x="4" y="7" width="452" height="2" fill="#dfdfdf"/>
  <rect x="4" y="7" width="2" height="44" fill="#dfdfdf"/>
  <!-- bevel: shadow bawah+kanan -->
  <rect x="2" y="49" width="456" height="2" fill="#0a0a0a"/>
  <rect x="456" y="5" width="2" height="46" fill="#0a0a0a"/>
  <rect x="4" y="47" width="452" height="2" fill="#808080"/>
  <rect x="454" y="7" width="2" height="42" fill="#808080"/>
  <!-- teks: bayangan putih 1px (efek timbul khas 98) + navy -->
  <text x="231" y="38" text-anchor="middle" font-family="Tahoma, 'MS Sans Serif', 'Liberation Sans', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3" fill="#ffffff">CONTAGION-STOP</text>
  <text x="230" y="37" text-anchor="middle" font-family="Tahoma, 'MS Sans Serif', 'Liberation Sans', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3" fill="#000080">CONTAGION-STOP</text>
</svg>
