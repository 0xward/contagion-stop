<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 56" width="460" height="56" role="img" aria-label="CONTAGION-STOP">
  <!-- Varian C — Two-tone: CONTAGION navy, hubung + STOP merah
       (#c00000 = warna destructive di palet situs, semantik "stop").
       Hubung diperbesar (34px) dan sedikit terangkat agar jadi aksen.
       Palet: #000080 / #c00000. -->
  <text x="230" y="37" text-anchor="middle" font-family="Tahoma, 'MS Sans Serif', 'Liberation Sans', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3"><tspan fill="#000080">CONTAGION</tspan><tspan fill="#c00000" font-size="34" dy="-2">-</tspan><tspan fill="#c00000">STOP</tspan></text>
</svg>
